<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    
    <main>
        <div class="container">
            <h4>Rock Paper Scissors Game</h4>

            <div class="imgContainer">
                <img src="./paper.png.png" alt="paper" id="paper">
                <img src="./rock.png.png" alt="rock" id="rock">
                <img src="./scissors.png.png" alt="scissors" id="scissors">
            </div>

            <div class="pointsContainer">
                <p>Your points: <span id="yourPoints"></span></p>
                <p>Computer points: <span id="computerPoints"></span></p>
            </div>
        </div>
    </main>
    <script src="./main.js"></script>
</body>
</html>
