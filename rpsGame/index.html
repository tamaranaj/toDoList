<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    
    <main>
        <div class="container" id="container">
            <h4>Rock Paper Scissors Game</h4>

            <div class="imgContainer">
                <img src="./paper.png" alt="paper" id="paper">
                <img src="./rock.png" alt="rock" id="rock">
                <img src="./scissors.png" alt="scissors" id="scissors">
            </div>


            <div>
                <button id="startGame">Start Game</button>
            </div>


            <div class="pointsContainer">
                <h4 id="userChoice"></h4>
                <h4 id="computerChoice"></h4>
            </div>



            <div class="pointsContainer">
                <p class="points">Your points: <span id="yourPoints">0</span></p>
                <p class="points">Computer points: <span id="computerPoints">0</span></p>
            </div>


            <div id="winner"></div>
        </div>
    </main>
    <script src="./main.js"></script>
</body>
</html>
